name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      BASE_PATH: /${{ github.event.repository.name }}/
      # المفتاح العام (anon) آمن في الواجهة؛ الحماية في سياسات RLS
      VITE_SUPABASE_URL: https://pqkaotqtwdaoolbjzpyk.supabase.co
      VITE_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBxa2FvdHF0d2Rhb29sYmp6cHlrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE5OTM5NjMsImV4cCI6MjEwNzU2OTk2M30.v4tzdA3pG_ViauyjOcjWsEb-WoSHJoOmZfQPK9HqZsM
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      # GitHub Pages لا يدعم إعادة التوجيه: نسخة 404 تعيد الروابط العميقة إلى التطبيق
      - run: cp dist/index.html dist/404.html && touch dist/.nojekyll
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
